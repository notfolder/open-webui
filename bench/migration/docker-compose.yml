# マイグレーション計測用の PostgreSQL。
#   起動: docker compose up -d      停止: docker compose down
#   データごと消す: docker compose down -v
# バージョンを変えるときは PG_VERSION を指定する（例: PG_VERSION=15 docker compose up -d）。
# データの形式はメジャーバージョンごとに違うので、変えるときは down -v で作り直す。
name: owui-migration-bench

services:
  postgres:
    image: postgres:${PG_VERSION:-16}
    container_name: owui-mig-pg
    environment:
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: owui
    ports:
      - "127.0.0.1:55432:5432"
    shm_size: 1g
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d owui -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  # 名前付きボリュームは OrbStack のデータ領域に置かれる。この Mac ではそれが外付け SSD
  # （/Volumes/SSD/OrbStack/data）なので、内蔵ディスクは使わない。
  # ホストのフォルダを直接マウントすると入出力が遅くなり、計測が実際より遅く出るので使わない。
  pgdata:
